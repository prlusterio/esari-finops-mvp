<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="Sample deposit slip proof of payment">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
  </defs>
  <rect width="960" height="640" fill="url(#desk)"/>
  <rect x="170" y="70" width="620" height="460" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <rect x="170" y="70" width="620" height="64" rx="10" fill="#1e3a8a"/>
  <rect x="170" y="118" width="620" height="16" fill="#1e3a8a"/>
  <text x="200" y="112" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">BDO Deposit Slip</text>
  <text x="200" y="170" fill="#6b7280" font-family="Arial, sans-serif" font-size="16">Account Name</text>
  <text x="200" y="198" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700">Manila Central Retailers</text>
  <text x="200" y="250" fill="#6b7280" font-family="Arial, sans-serif" font-size="16">Reference / Request</text>
  <text x="200" y="278" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700">REQ-1234</text>
  <text x="200" y="330" fill="#6b7280" font-family="Arial, sans-serif" font-size="16">Amount Deposited</text>
  <text x="200" y="368" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="36" font-weight="700">PHP 150,000.00</text>
  <text x="200" y="420" fill="#6b7280" font-family="Arial, sans-serif" font-size="16">Date</text>
  <text x="200" y="448" fill="#111827" font-family="Arial, sans-serif" font-size="20" font-weight="600">Oct 24, 2023</text>
  <text x="200" y="500" fill="#9ca3af" font-family="Arial, sans-serif" font-size="14">Demo proof of payment for eSariSari MVP</text>
  <rect x="700" y="430" width="18" height="150" rx="6" fill="#1f2937" transform="rotate(-18 700 430)"/>
  <rect x="690" y="420" width="18" height="40" rx="4" fill="#f59e0b" transform="rotate(-18 690 420)"/>
</svg>
